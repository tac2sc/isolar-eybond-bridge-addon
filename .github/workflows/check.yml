name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - run: bash -n isolar_eybond_usb_bridge/run.sh
  image:
    needs: tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --build-arg BUILD_ARCH=${{ matrix.arch }} -t bridge-test isolar_eybond_usb_bridge
      - run: docker run --rm --entrypoint python3 bridge-test /app/bridge.py --help
      - run: docker run --rm --entrypoint python3 -e BRIDGE_SOURCE=/app/bridge.py -v "$PWD/tests:/tests:ro" bridge-test -m unittest discover -s /tests -v
