name: Publish reviewed candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version matching config.yaml (for example 0.2.0)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - name: Verify requested version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os,yaml; c=yaml.safe_load(open("isolar_eybond_usb_bridge/config.yaml")); assert c["version"] == os.environ["RELEASE_TAG"]'
  publish:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: isolar_eybond_usb_bridge
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/tac2sc/isolar-eybond-bridge-addon:${{ inputs.tag }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ inputs.tag }}
            BUILD_ARCH=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
  manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/tac2sc/isolar-eybond-bridge-addon:${RELEASE_TAG}" \
            "ghcr.io/tac2sc/isolar-eybond-bridge-addon:${RELEASE_TAG}-amd64" \
            "ghcr.io/tac2sc/isolar-eybond-bridge-addon:${RELEASE_TAG}-aarch64"
